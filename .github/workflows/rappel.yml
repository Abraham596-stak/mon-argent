# Rappel du soir « As-tu noté tes dépenses ? » (entre 21h et 22h30, heure du Bénin)
name: Rappel du soir
on:
  schedule:
    - cron: "0 20 * * *"
    - cron: "20 20 * * *"
    - cron: "45 20 * * *"
    - cron: "10 21 * * *"
  workflow_dispatch:
concurrency:
  group: rappel
jobs:
  rappel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: rappels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node rappel-soir.mjs
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
