# Rappels Mon Argent : 14h30 (dépenses du matin) et 22h30 (dépenses depuis 14h30), heure du Bénin.
# GitHub lance parfois ses horaires en retard : plusieurs essais, un seul envoi par rappel.
name: Rappels
on:
  schedule:
    - cron: "30 13 * * *"
    - cron: "45 13 * * *"
    - cron: "5 14 * * *"
    - cron: "35 14 * * *"
    - cron: "30 21 * * *"
    - cron: "45 21 * * *"
    - cron: "5 22 * * *"
    - cron: "35 22 * * *"
  workflow_dispatch:
concurrency:
  group: rappel
jobs:
  rappel:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: rappels
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      - run: node rappel.mjs auto
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
