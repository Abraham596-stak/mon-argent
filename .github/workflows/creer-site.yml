name: Creer site
on: workflow_dispatch
jobs:
  c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          for n in mon-argent-app mon-argent monargent-app mon-argent-pro; do
            if npx -y firebase-tools@13 hosting:sites:create "$n" --project mon-argent-d2d8d --non-interactive > o.txt 2>&1; then echo "::notice::SITE=$n"; exit 0; fi
            tail -2 o.txt | while read -r l; do echo "::warning::$n $l"; done
          done
          exit 1
